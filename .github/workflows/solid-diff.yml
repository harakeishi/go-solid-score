name: solid-score-diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Build the tool from this checkout so the workflow always matches the
      # code under review. (External users instead consume the published action,
      # `uses: harakeishi/go-solid-score@v0.3.0` — see action.yml and the README.)
      - name: Build go-solid-score
        run: go build -o "$RUNNER_TEMP/gss" .

      - name: Score base (PR base commit)
        env:
          # base.sha is a commit SHA (hex), but pass it via env and quote it
          # rather than interpolating into the shell, per Actions best practice.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Analyze the base commit's source with the freshly built binary, so
          # the base does not need to contain the tool itself.
          git worktree add /tmp/base "$BASE_SHA"
          (cd /tmp/base && "$RUNNER_TEMP/gss" -f json ./...) > base.json

      - name: Diff against base
        run: |
          "$RUNNER_TEMP/gss" diff --base base.json -f markdown ./... > comment.md
          "$RUNNER_TEMP/gss" diff --base base.json ./...  # human-readable log

      # Same-repo PRs have a write token: post (and update) a sticky comment.
      # Uses the official actions/github-script (bundled on every runner) rather
      # than a third-party action. The markdown body already starts with the
      # "<!-- go-solid-score-diff -->" marker, which we match to update the
      # previous comment instead of posting a new one.
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- go-solid-score-diff -->';
            const body = fs.readFileSync('comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Fork PRs run with a read-only token, so commenting would 403. Fall back
      # to the job summary, which is always writable. (Do NOT switch to
      # pull_request_target — that would run untrusted fork code with a write
      # token.)
      - name: Report to job summary (fork PRs)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"
