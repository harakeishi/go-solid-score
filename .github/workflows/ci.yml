name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # Accuracy gate: fail if the scorer regressed against the committed baseline —
  # a known violation now missed (recall floor) or a sound type newly flagged
  # (new false positive). This is the recall-non-regression check the
  # accuracy-improvement design (rev3) introduced: past calibration only ever
  # relaxed penalties (improving precision) without measuring whether it started
  # missing real violations. See scripts/evaluate.sh and docs/scoring-analysis.md.
  accuracy:
    runs-on: ubuntu-latest
    # The gate loads testdata with go/packages (NeedTypes|NeedDeps), which
    # fully builds the target source. A cgo preamble would invoke the C
    # compiler on that source — an arbitrary-code-execution surface if a PR
    # adds a cgo file under testdata/. Disable cgo so no C toolchain runs;
    # the SOLID analysis never needs it.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/evaluate.sh

  # Smoke-test the composite action (action.yml) so a change that breaks the
  # download/run wiring is caught here rather than by downstream consumers. Runs
  # in "check" mode against this repo with a generous floor; the point is that
  # the action installs the released binary and exits cleanly, not the score.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: check
          paths: ./...
          min-score: "0"
